<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GMOあおぞら API 認可（dev）</title>
<style>body{font-family:-apple-system,"Hiragino Sans",sans-serif;max-width:640px;margin:40px auto;padding:0 20px;color:#222}code{display:block;background:#f4f4f4;padding:12px;border-radius:8px;word-break:break-all;font-size:14px}.ok{color:#1a7f37}.ng{color:#b00}</style></head><body>
<h2>GMOあおぞらネット銀行 API 認可 <small>(dev)</small></h2>
<p id="msg">読み込み中…</p>
<code id="code"></code>
<p style="font-size:13px;color:#666">この画面は株式会社mela / 株式会社mela gym の経理システム専用です。表示された値は担当者にだけ渡してください。この画面は値を保存も送信もしません。</p>
<script>
const q=new URLSearchParams(location.search);const c=q.get('code'),e=q.get('error');
const m=document.getElementById('msg'),o=document.getElementById('code');
if(c){m.innerHTML='<span class="ok">認可が完了しました。</span> 下の認可コードを経理担当（invoice@melagrp.com）に伝えてください。有効期限は数分です。';o.textContent='code: '+c+(q.get('state')?'\nstate: '+q.get('state'):'');}
else if(e){m.innerHTML='<span class="ng">認可が拒否・失敗しました。</span>';o.textContent=e+' '+(q.get('error_description')||'');}
else{m.textContent='ここは銀行の認可画面から戻ってくるためのページです。直接開いても何も起きません。';}
</script></body></html>
