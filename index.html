<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>mela 経理</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{--bg:#F6F4F1;--panel:#fff;--line:#E4E0DB;--line2:#CFC9C2;--ink:#1F1B1A;--ink2:#5B5551;--mute:#8C857F;--acc:#F05A3E;--accbg:#FDEDE8;--ok:#1E8A5A;--okbg:#E3F3EA;--warn:#B26A00;--warnbg:#FBEFD6;--bad:#C8322B;--badbg:#FAE3E1;--info:#2B5DA8;--infobg:#E3ECF8;--grey:#EEEBE7}
*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Hiragino Sans",sans-serif;font-size:14px;line-height:1.6;-webkit-text-size-adjust:100%}
button,select,input,textarea{font:inherit}
a{color:var(--info)}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.app>*{min-width:0}
.side{background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh}
.brand{font-weight:700;font-size:16px;line-height:1.3}.brand small{display:block;font-weight:400;color:var(--mute);font-size:11px;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{text-align:left;background:none;border:0;color:var(--ink2);padding:10px 12px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14.5px}
.nav button.on{background:var(--accbg);color:var(--acc);font-weight:700}
.cnt{font-size:11px;background:var(--grey);border-radius:10px;padding:1px 7px;font-variant-numeric:tabular-nums}
.nav button.on .cnt{background:var(--acc);color:#fff}
.topbar{display:none;position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 12px;align-items:center;gap:12px}
.burger{width:42px;height:42px;border:1px solid var(--line);background:var(--panel);border-radius:10px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;flex:none;-webkit-tap-highlight-color:transparent}
.burger i{display:block;width:18px;height:2px;background:var(--ink);border-radius:2px}
.topttl{font-weight:700;font-size:16px;line-height:1.2}
.topttl small{display:block;font-weight:400;font-size:11.5px;color:var(--mute)}
.backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:39}
.backdrop.on{display:block}
.nav .navsub{padding-left:24px;font-size:13.5px;color:var(--mute)}
.nav .navsub.on{color:var(--acc);font-weight:700;background:none}
.side .foot{margin-top:auto;font-size:11.5px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
.main{padding:24px 28px 80px}
h1{font-size:21px;margin:0 0 4px}.sub{color:var(--mute);margin:0 0 16px;font-size:13px}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px;border-bottom:1px solid var(--line);padding-bottom:10px}
.subnav button{border:1px solid var(--line);background:var(--panel);color:var(--ink2);border-radius:18px;padding:7px 14px;font-size:13.5px;cursor:pointer;display:flex;align-items:center;gap:6px}
.subnav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.subnav .cnt{background:rgba(0,0,0,.07)}.subnav button.on .cnt{background:rgba(255,255,255,.25);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;margin-bottom:18px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
.tile .l{font-size:12px;color:var(--mute)}.tile .v{font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}.tile .s{font-size:12px;color:var(--ink2)}
.tile.bad .v{color:var(--bad)}.tile.warn .v{color:var(--warn)}.tile.ok .v{color:var(--ok)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.card h2{font-size:14.5px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card h2 small{font-weight:400;color:var(--mute);font-size:12px}
.hint{display:block;font-size:11.5px;color:var(--mute);font-weight:400;margin-top:3px}
#working{position:fixed;inset:0;background:rgba(255,255,255,.82);backdrop-filter:blur(2px);z-index:9999;display:flex;align-items:center;justify-content:center}
.wk{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 30px;max-width:340px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.12)}
.spin{width:38px;height:38px;border:4px solid var(--line);border-top-color:var(--accent,#E8456B);border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wkt{font-size:16px;font-weight:700}.wks{font-size:12.5px;color:var(--mute);margin-top:6px;line-height:1.6}.wkc{font-size:12px;color:var(--mute);margin-top:10px;font-variant-numeric:tabular-nums;min-height:1em}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.th{position:relative;width:88px;height:88px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.thx{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:22px;padding:0;cursor:pointer}
.wide{width:100%;box-sizing:border-box}
.card.head{padding:14px 16px}
.hrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.hname{font-size:17px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hamt{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.hsub{font-size:12px;color:var(--mute);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 0;align-items:center}
.steps{display:flex;align-items:center;margin:12px 0 10px}
.stp{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mute);min-width:44px}
.stp .dot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;background:var(--panel)}
.stp.done{color:var(--ok)}.stp.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.stp.now{color:var(--ink);font-weight:700}.stp.now .dot{border-color:var(--ink);border-width:2px}
.ln{flex:1;height:1.5px;background:var(--line);margin:0 2px 16px}
.hnext{margin-top:6px}
details.more{margin-top:10px}details.more>summary{cursor:pointer;font-size:13px;color:var(--mute);padding:6px 0;list-style:none}
details.more>summary::-webkit-details-marker{display:none}details.more>summary::before{content:'▸ ';}details.more[open]>summary::before{content:'▾ ';}
details.more .tools{margin-top:6px}
details.more.memo{margin:10px 0}
@media(max-width:820px){ details.more .tools .btn, details.more .tools a.btn{width:100%;box-sizing:border-box;text-align:center;margin-bottom:6px} }
.btn.danger{color:var(--bad);border-color:var(--bad)}.btn.danger:hover{background:rgba(200,40,40,.06)}
.shot{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.shot-h{font-size:13.5px;font-weight:700;margin-bottom:3px}
.shot-s{font-size:12px;color:var(--mute);line-height:1.6;margin-bottom:9px}
.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:11px 15px;border-bottom:1px solid var(--line);font-size:14px;font-weight:700;background:rgba(0,0,0,.02)}
.mhead.warn{color:var(--bad);background:rgba(200,40,40,.05)}
.mhead b{font-variant-numeric:tabular-nums}
details.card>summary{list-style:none}details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:'▾';margin-left:6px;color:var(--mute)}
details.card[open]>summary::after{content:'▴'}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}
th{font-size:11.5px;color:var(--mute);font-weight:500}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.row{cursor:pointer}tr.row:hover td{background:var(--grey)}
.pill{display:inline-block;padding:1px 9px;border-radius:10px;font-size:11.5px;font-weight:700;white-space:nowrap}
.p-ok{background:var(--okbg);color:var(--ok)}.p-warn{background:var(--warnbg);color:var(--warn)}.p-bad{background:var(--badbg);color:var(--bad)}.p-info{background:var(--infobg);color:var(--info)}.p-grey{background:var(--grey);color:var(--ink2)}
.ent{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;color:#fff;background:#FF4D0A;white-space:nowrap}
.ent.E01{background:linear-gradient(135deg,#E8456B,#F06A2D)}
.btn{border:1px solid var(--line2);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:8px;font-size:13.5px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.btn.big{padding:12px 20px;font-size:15px}
.btn.sm{padding:5px 11px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.sp{flex:1}
.filters button{border:1px solid var(--line);background:var(--panel);color:var(--ink2);border-radius:14px;padding:5px 12px;font-size:12.5px;cursor:pointer;margin-right:4px}
.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sel{padding:8px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);color:var(--ink);width:100%}
.fl{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mute);margin-bottom:12px}
.fl>b{font-size:12px;color:var(--mute);font-weight:400}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:1000px){.split{grid-template-columns:1fr}}
.note{font-size:12.5px;color:var(--ink2);background:var(--grey);border-radius:8px;padding:10px 12px;margin-bottom:12px}
.empty{color:var(--mute);padding:20px 0;text-align:center}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line2);background:var(--panel);color:var(--ink2);border-radius:8px;padding:9px 13px;font-size:13.5px;cursor:pointer;text-align:left;line-height:1.35}
.seg button b{display:block;font-size:14px;color:var(--ink)}
.seg button small{display:block;font-size:11.5px;color:var(--mute)}
.seg button.on{border-color:var(--acc);background:var(--accbg);color:var(--acc)}
.seg button.on b,.seg button.on small{color:var(--acc)}
.voice{background:linear-gradient(180deg,#fff,#FDF7F5);padding:18px}
.vhead{font-size:12px;color:var(--mute);letter-spacing:.06em;text-align:center}
.micwrap{text-align:center;padding:10px 0 4px}
.mic{width:96px;height:96px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:40px;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(240,90,62,.35);transition:.15s;-webkit-tap-highlight-color:transparent}
.mic:active{transform:scale(.96)}
.mic.on{background:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(200,50,43,.5)}70%{box-shadow:0 0 0 20px rgba(200,50,43,0)}100%{box-shadow:0 0 0 0 rgba(200,50,43,0)}}
.michead{font-size:17px;font-weight:700;margin-top:10px}
.micsub{font-size:13px;color:var(--ink2);margin-top:2px}
.says{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin:16px 0 10px}
.say{display:flex;gap:9px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.say i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;font-style:normal;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.say.opt i{background:var(--mute)}
.say b{display:block;font-size:12px;color:var(--mute);font-weight:500}
.say span{font-size:15px;font-weight:700}
.sayall{background:var(--accbg);color:var(--acc);border-radius:8px;padding:10px 12px;font-size:14px;font-weight:700;line-height:1.6}
textarea.vt{width:100%;min-height:92px;border:1px solid var(--line2);border-radius:10px;padding:12px;margin-top:12px;line-height:1.7;font-size:16px}
.exwrap{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.exlabel{font-size:12px;color:var(--mute);margin-bottom:6px}
.ex1{display:block;background:var(--grey);border-radius:8px;padding:9px 12px;margin-bottom:6px;font-size:14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ex1:active{background:var(--accbg);color:var(--acc)}
.mchip{display:inline-block;background:var(--grey);border-radius:10px;padding:3px 10px;margin:3px 5px 3px 0;font-size:13px;color:var(--ink2);text-decoration:none}
.mchip b{color:var(--ink)}
.paperwrap{background:var(--grey);padding:14px;border-radius:10px;overflow:auto}
iframe.paper{width:210mm;height:297mm;border:0;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.12);display:block;margin:0 auto;transform-origin:top left}
textarea.mail{width:100%;min-height:260px;border:1px solid var(--line2);border-radius:8px;padding:12px;line-height:1.7;resize:vertical;font-size:14px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none;max-width:88vw;z-index:50;text-align:center}
#toast.on{opacity:1}
@media(max-width:820px){
  body{font-size:15px}
  .app{grid-template-columns:1fr}
  .app>*{min-width:0;max-width:100%}
  .topbar{display:flex}
  .side{position:fixed;top:0;left:0;bottom:0;width:78%;max-width:300px;z-index:40;transform:translateX(-100%);transition:transform .22s ease;box-shadow:4px 0 20px rgba(0,0,0,.12);overflow-y:auto;height:100%}
  .side.open{transform:translateX(0)}
  .side .foot{display:flex}
  .nav button{padding:12px 12px;font-size:15.5px}
  .nav .navsub{padding-left:26px;font-size:14px}
  .main{padding:16px 12px 70px}
  .card{padding:14px}.voice{padding:14px}
  .tiles{grid-template-columns:1fr 1fr;gap:8px}
  .tile .v{font-size:20px}
  .says{grid-template-columns:1fr 1fr}
  .say span{font-size:14px}.sayall{font-size:13.5px}
  .split{grid-template-columns:1fr}
  .sel{font-size:16px;padding:10px 12px}
  .btn{padding:10px 15px;font-size:15px}.btn.sm{padding:6px 12px;font-size:13px}
  .seg{display:grid;grid-template-columns:1fr 1fr}
  table{font-size:13.5px}th,td{padding:9px 8px}
  .paperwrap{padding:8px}
}
</style></head><body>
<div class="topbar" id="topbar">
  <button class="burger" id="burger" aria-label="メニュー"><i></i><i></i><i></i></button>
  <div class="topttl" id="topttl">mela 経理<small>invoice@melagrp.com</small></div>
</div>
<div class="backdrop" id="backdrop"></div>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">mela 経理<small>invoice@melagrp.com</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot" id="foot"></div>
  </aside>
  <main class="main" id="main"><div class="empty">読み込み中…</div></main>
</div>
<div id="toast"></div>
<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwXOKcewGxJTEUf2IfNTWgElPXqFvfZVHpkKEwWFNn3nUMzqwkuDBtO7sHXsmqeaQIK/exec';
let CODE = 'q3sqawj3';
const _qs = new URLSearchParams(location.search);

const VIEWS = [['home','ホーム'],['bill','請求する'],['pay','支払う'],['docs','書類'],['settings','設定']];
const SUBS = {
  bill: [['new','作る'],['ar','一覧'],['invoice','確認・送付'],['dun','催促']],
  pay:  [['ap','一覧'],['expense','立替・経費'],['line','LINE受信']],
};
const LEGACY = {ar:['bill','ar'],invoice:['bill','invoice'],dun:['bill','dun'],new:['bill','new'],ap:['pay','ap'],line:['pay','line'],expense:['pay','expense']};
const PILL = {'作成待ち':'p-grey','確認待ち':'p-warn','作成済':'p-info','送付済':'p-info','入金済':'p-ok','未入金':'p-warn','催促中':'p-bad','取消':'p-grey','支払予定':'p-info','支払済':'p-ok','未請求':'p-warn','請求済':'p-ok'};

const S = { view:'home', sub:{}, boot:null, ar:[], ap:[], line:[], expenses:[], tree:null, dash:null, sel:_qs.get('id')||null, filter:'all', busy:false, edit:null };
(function initView(){
  const v=_qs.get('view');
  if(v){
    if(LEGACY[v]){ S.view=LEGACY[v][0]; S.sub[S.view]=LEGACY[v][1]; }
    else if(VIEWS.some(x=>x[0]===v)) S.view=v;
    const sb=_qs.get('sub'); if(sb) S.sub[S.view]=sb;
  }
  if(_qs.get('id')){ S.view='bill'; S.sub.bill='invoice'; }
})();
const subOf = v => S.sub[v] || (SUBS[v] ? SUBS[v][0][0] : null);

const yen = n => n==null||n===''||isNaN(n) ? '—' : '¥'+Math.round(Number(n)).toLocaleString('ja-JP');
const pill = s => `<span class="pill ${PILL[s]||'p-grey'}">${s||'—'}</span>`;
const entTag = e => `<span class="ent ${e}">${e==='E01'?'mela':e==='E02'?'mela gym':e}</span>`;
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// input[type=date] は yyyy-MM-dd しか受け付けない。台帳から来るISO日時のままだと空欄になる
const ymd = v => { if(!v) return ''; const d=new Date(v); return isNaN(d) ? String(v).slice(0,10) : new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
async function call(fn, ...args){
  const r = await fetch(GAS_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({api:fn, code:CODE, args}), redirect:'follow'});
  const j = await r.json();
  if(!j.ok) throw new Error(j.error||'error');
  return j.result;
}
window.addEventListener('unhandledrejection', e=>{ try{ toast('エラー: '+((e.reason&&e.reason.message)||e.reason)); }catch(_){} });
window.addEventListener('error', e=>{ try{ toast('エラー: '+(e.message||'不明')); }catch(_){} });
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),4000); }
function daysLate(r){ if(!r['支払期日']) return 0; return Math.floor((new Date(S.boot.today)-new Date(r['支払期日']))/86400000); }
const isUnpaid = r => ['送付済','未入金','催促中'].includes(r['状態']);

function applyAll(d){
  S.boot = {today:d.today, entities:d.entities||[], accounts:d.accounts||[], clients:d.clients||[], staff:d.staff||[], statuses:d.statuses||[], ledgerUrl:d.ledgerUrl, hubUrl:d.hubUrl, secrets:d.secrets||{}};
  S.ar=d.ar||[]; S.ap=d.ap||[]; S.line=d.line||[]; S.expenses=d.expenses||[]; S.dash=d.dash||null;
  document.getElementById('foot').innerHTML = `<a href="${S.boot.hubUrl}" target="_blank">Driveを開く</a><a href="${S.boot.ledgerUrl}" target="_blank">台帳を開く</a>`;
}
function cacheSave(d){ try{ localStorage.setItem('melahub-cache', JSON.stringify({t:Date.now(),d})); }catch(e){} }
function cacheLoad(){ try{ const c=JSON.parse(localStorage.getItem('melahub-cache')||'null'); return c&&c.d?c:null; }catch(e){ return null; } }

async function load(){
  const c = cacheLoad();
  if(c){ applyAll(c.d); render(); }
  else document.getElementById('main').innerHTML = '<div class="empty">読み込み中…</div>';
  try{
    let d;
    try { d = await call('api_all'); }
    catch(e){ if(!String(e.message||e).includes('unknown api')) throw e;
      const [boot,ar,ap,dash,line]=await Promise.all([call('api_bootstrap'),call('api_receivables'),call('api_payables'),call('api_dashboard'),call('api_lineInbox')]);
      d=Object.assign({},boot,{ar,ap,dash,line,expenses:[]}); }
    applyAll(d); cacheSave(d); render();
  }catch(e){
    if(!c) document.getElementById('main').innerHTML = `<div class="note">読み込みに失敗しました: ${esc(e.message||e)}</div>`;

function vAr(){
  const today=S.boot.today, thisM=today.slice(0,7);
  const all=S.ar.filter(r=>r['状態']!=='取消');
  const making=all.filter(r=>['作成待ち','確認待ち','作成済'].includes(r['状態']));
  const waiting=all.filter(r=>isUnpaid(r));            // 送付済・未入金・催促中
  const paid=all.filter(r=>r['状態']==='入金済');
  const late=waiting.filter(r=>daysLate(r)>0);

  const g={};
  waiting.forEach(r=>{ const m=ymd(r['支払期日']).slice(0,7)||'未定'; (g[m]=g[m]||[]).push(r); });
  const months=Object.keys(g).filter(k=>k!=='未定').sort();
  const over=months.filter(m=>m<thisM), rest=months.filter(m=>m>=thisM);

  const head=`<div class="tiles">
    <div class="tile"><div class="l">今月（${Number(thisM.slice(5,7))}月）入る予定</div><div class="v">${yen(sumAr((g[thisM]||[]).filter(r=>daysLate(r)<=0)))}</div><div class="s">${(g[thisM]||[]).filter(r=>daysLate(r)<=0).length}件</div></div>
    <div class="tile${late.length?' bad':''}"><div class="l">期日を過ぎている</div><div class="v">${yen(sumAr(late))}</div><div class="s">${late.length}件</div></div>
    <div class="tile${making.length?' warn':''}"><div class="l">まだ送っていない</div><div class="v">${yen(sumAr(making))}</div><div class="s">${making.length}件</div></div>
  </div>`;

  const block=(m,warn)=>`<div class="card" style="padding:0">
    <div class="mhead${warn?' warn':''}"><span>${warn?'⚠ ':''}${m==='未定'?'入金期日が入っていないもの':`${m.slice(0,4)}年${Number(m.slice(5,7))}月に入る予定`}</span><span>${g[m].length}件　<b>${yen(sumAr(g[m]))}</b></span></div>
    ${arTable(g[m].slice().sort((a,b)=>String(a['取引先']).localeCompare(String(b['取引先']))))}</div>`;

  let body=over.map(m=>block(m,true)).join('')+rest.map(m=>block(m,false)).join('');

  const mk=making.length?`<div class="card" style="padding:0"><div class="mhead warn"><span>まだ送っていない請求</span><span>${making.length}件　<b>${yen(sumAr(making))}</b></span></div>

  return `<p class="sub">出した請求と、入金の予定。入る月ごとに分けています。入金を確認したら「入金済」に変えてください。</p>
  ${head}${mk}${body}

}

        <button type="button" class="btn sm" id="eadditem" style="margin-bottom:12px">＋ 品目を追加</button>
        <div class="split"><label class="fl">請求日<input name="date" class="sel" type="date" value="${ymd(inv['請求日'])}"></label><label class="fl">支払期日<input name="due" class="sel" type="date" value="${ymd(inv['支払期日'])}"></label></div>
        <div class="fl"><b>振込先の口座</b><div id="eaccseg">${segAccount('eaccount',inv['口座ID'],inv['法人'])}</div></div>
      </div></div>
      <div class="tools" style="margin-top:8px"><button class="btn pri" id="esave">この内容で保存</button><span style="font-size:12px;color:var(--mute)">保存すると下の請求書に反映されます</span></div>
    </form></div>`;
  // 段階: 作成 → 送付 → 入金 → 領収書。次の一手を1つだけ大きく出し、残りは畳む
  const stage = st==='入金済' ? 3 : (['送付済','未入金','催促中'].includes(st) ? 2 : (st==='作成済' ? 1 : 0));
  const rcptDone = /領収書 \d{4}-\d{2}-\d{2} 発行/.test(String(inv['メモ']||''));
  const hasMail = !!inv['送付先メール'];
  let primary = '';
  if(stage===0) primary = canPdf
      ? `<button class="btn pri big wide" id="mkpdf">PDFを作って下書きへ</button>`
      : `<div class="note">金額が入っていない品目があります。下の欄で単価を入れて保存すると、PDFを作れます。</div>`;
  else if(stage===1) primary = hasMail && inv['下書きURL']
      ? `<button class="btn pri big wide" id="opensend">送る前に確認して送信</button>`
      : `<button class="btn pri big wide" id="lineinv">LINEで送る</button>`;
  else if(stage===2) primary = `<button class="btn pri big wide" id="markpaid">入金を確認した → 入金済にする</button>`;
  else primary = rcptDone ? '' : `<button class="btn pri big wide" id="mkrcpt">領収書を作って下書きへ</button>`;
  const stepLbl = ['作成','送付','入金','領収書'];
  const steps = `<div class="steps">${stepLbl.map((l,i)=>`<div class="stp ${i<stage?'done':i===stage?'now':''}"><span class="dot">${i<stage?'✓':i+1}</span><span>${l}</span></div>`).join('<div class="ln"></div>')}</div>`;
  const nextHint = ['内容を確認してPDFを作ります','メールかLINEで相手に送ります','入金があったら「入金済」にします','入金済です。必要なら領収書を出せます'][stage];
  const secondary = [
    stage!==0 && canPdf ? `<button class="btn" id="mkpdf">PDFを作り直す</button>` : '',
    inv['PDF'] ? `<a class="btn" href="${esc(driveDl(inv['PDF']))}" download>PDFを保存</a><a class="btn" href="${esc(String(inv['PDF']).split('\n')[0])}" target="_blank" rel="noopener">PDFを開く</a>` : '',
    inv['下書きURL'] && !(stage===1 && hasMail) ? `<a class="btn" href="${esc(inv['下書きURL'])}" target="_blank" rel="noopener">Gmail下書きを開く</a>` : '',
    stage===1 && hasMail && inv['下書きURL'] ? `<button class="btn" id="lineinv">LINEで送る</button>` : (stage!==1 && Number(inv['税込']) ? `<button class="btn" id="lineinv">LINEで送る</button>` : ''),
    st==='作成済' ? `<button class="btn" id="marksent">送った → 送付済にする</button>` : '',
    stage!==2 && isUnpaid(inv) ? `<button class="btn" id="markpaid">入金を確認した → 入金済</button>` : '',
    stage!==3 && Number(inv['税込']) ? `<button class="btn" id="mkrcpt">領収書を作る</button>` : (stage===3 && rcptDone ? `<button class="btn" id="mkrcpt">領収書をもう一度作る</button>` : ''),
    isDraft ? '' : `<button class="btn" id="editon">内容を直す</button>`,
    st!=='入金済' ? `<button class="btn danger" id="delinv">この請求を削除</button>` : '',
  ].filter(Boolean).join('');
  const memo = String(inv['メモ']||'');
  return `<select id="invsel" class="sel wide">${S.ar.map(r=>`<option value="${esc(r['請求ID'])}" ${r['請求ID']===inv['請求ID']?'selected':''}>${esc(r['取引先'])}　${yen(r['税込'])}　${esc(r['状態'])}　${esc(r['請求ID'])}</option>`).join('')}</select>
  <div class="card head">
    <div class="hrow"><div class="hname">${esc(inv['取引先'])}${/御中|様$/.test(String(inv['取引先']))?'':' 様'}</div><div class="hamt">${yen(inv['税込'])}</div></div>
    <div class="hsub">${esc(inv['請求ID'])}　${pill(st)}　請求日 ${ymd(inv['請求日'])||'—'}　期日 ${ymd(inv['支払期日'])||'—'}${isUnpaid(inv)&&daysLate(inv)>0?`　<span style="color:var(--bad);font-weight:700">${daysLate(inv)}日超過</span>`:''}</div>
    ${steps}
    <div class="hnext"><div class="hint" style="margin-bottom:6px">次にやること　${nextHint}</div>${primary}</div>
    <details class="more"><summary>その他の操作</summary><div class="tools">${secondary}</div></details>
  </div>
   <div id="sendbox"></div>
   <div id="linebox"></div>
  ${memo?`<details class="more memo"><summary>読み取りメモ・履歴</summary><div class="note">${esc(memo)}</div></details>`:''}
  ${form}
  ${!inv.items||!inv.items.length?`<div class="note">過去にinvoyで出した分の取り込みなので品目データがありません。PDFはDriveの保存分を開いてください。</div>`:''}
  <div class="paperwrap"><iframe class="paper" id="paperframe" sandbox="allow-same-origin"></iframe></div>`;
}
async function showSendCard(){
  const box=document.getElementById('sendbox'); if(!box) return;
  box.innerHTML=`<div class="card" id="sendcard"><div class="empty">下書きを読み込んでいます…</div></div>`;
  let d; try{ d=await call('api_draftPreview',S.sel); }catch(e){ box.innerHTML=`<div class="card" id="sendcard"><div class="note">失敗: ${esc(e.message||e)}</div></div>`; return; }
  if(!d.draftId){
    box.innerHTML=`<div class="card" id="sendcard"><h2>Driveに保存しました</h2>
      <div class="note">${d.folder?esc(d.folder):''}${d.pdf?`　<a href="${esc(d.pdf)}" target="_blank" rel="noopener">PDFを開く</a>`:''}</div>
      <div class="hint" style="margin-top:8px">送付先メールが登録されていないため、メールの下書きは作っていません。「内容を直す」で送付先を入れるか、「LINEで送る」を使ってください。</div></div>`;
    return;
  }
  box.innerHTML=`<div class="card" id="sendcard"><h2>送る前に確認<small>Driveに保存済み：${esc(d.folder||'')}</small></h2>
    <label class="fl">宛先<input class="sel" id="sd_to" value="${esc(d.to)}"></label>

    <div class="hint">添付：${d.attachments.map(esc).join('、')||'なし'}　／　CC：invoice@melagrp.com</div>
    <div class="tools" style="margin-top:12px"><button class="btn pri big" id="sd_send">このメールを送信する</button><span class="hint">押すとGmailから送信されます。取り消せません。</span></div></div>`;
  document.getElementById('sd_send').onclick=async()=>{
    const to=document.getElementById('sd_to').value.trim();

    showWorking('送信しています', '', true);

  };

async function loadPaper(){

function fitPaper(){ const w=document.querySelector('.paperwrap'),p=document.getElementById('paperframe'); if(!w||!p) return; const avail=w.clientWidth-28, pw=794; const k=Math.min(1,avail/pw); p.style.transform=`scale(${k})`; w.style.height=(1123*k+28)+'px'; }
window.addEventListener('resize',fitPaper);

function vAp(){
  const today=S.boot.today, thisM=today.slice(0,7);
  const live=S.ap.filter(r=>!['支払済','対象外'].includes(r['状態']));
  const paid=S.ap.filter(r=>r['状態']==='支払済');
  const g={};
  live.forEach(r=>{ const m=ymd(r['支払期日']).slice(0,7)||'未定'; (g[m]=g[m]||[]).push(r); });
  const months=Object.keys(g).filter(k=>k!=='未定').sort();
  const over=months.filter(m=>m<thisM), rest=months.filter(m=>m>=thisM);

  const thisSum=sumYen(g[thisM]||[]);
  const overSum=over.reduce((s,m)=>s+sumYen(g[m]),0);
  const laterSum=rest.filter(m=>m!==thisM).reduce((s,m)=>s+sumYen(g[m]),0);
  const head=`<div class="tiles">
    <div class="tile"><div class="l">今月（${Number(thisM.slice(5,7))}月）に払う</div><div class="v">${yen(thisSum)}</div><div class="s">${(g[thisM]||[]).length}件</div></div>
    <div class="tile${overSum?' bad':''}"><div class="l">期限を過ぎている</div><div class="v">${yen(overSum)}</div><div class="s">${over.reduce((s,m)=>s+g[m].length,0)}件</div></div>
    <div class="tile"><div class="l">来月以降</div><div class="v">${yen(laterSum)}</div><div class="s">${rest.filter(m=>m!==thisM).reduce((s,m)=>s+g[m].length,0)}件</div></div>
  </div>`;

  const block=(m,warn)=>`<div class="card" style="padding:0">
    <div class="mhead${warn?' warn':''}"><span>${warn?'⚠ ':''}${monthLabel(m)}</span><span>${g[m].length}件　<b>${yen(sumYen(g[m]))}</b></span></div>
    ${apTable(g[m].sort((a,b)=>String(a['取引先']).localeCompare(String(b['取引先']))))}</div>`;

  let body=over.map(m=>block(m,true)).join('')+rest.map(m=>block(m,false)).join('');
  if(g['未定']) body+=`<div class="card" style="padding:0"><div class="mhead"><span>${monthLabel('未定')}</span><span>${g['未定'].length}件　<b>${yen(sumYen(g['未定']))}</b></span></div>
    <div style="padding:10px 14px"><div style="font-size:13px;color:var(--mute);margin-bottom:8px">まだPDFを読んでいないものです。「PDFを読む」を押すと、金額・支払期日・登録番号を読み取って上の月ごとの表に移します。1回で5件ずつ、30秒ほどかかります。</div>
    <button class="btn pri" id="readap">PDFを読む</button></div>${apTableFill(g['未定'])}</div>`;
  if(!body) body='<div class="card"><div class="empty">支払い待ちはありません</div></div>';

  return `<p class="sub">受け取った請求書と、こちらが出した支払通知書。支払う月ごとに分けています。振り込んだら「支払済」に変えてください。</p>
  ${head}${body}
  <details class="card" style="padding:0"><summary class="mhead" style="cursor:pointer"><span>支払い終わったもの</span><span>${paid.length}件　<b>${yen(sumYen(paid))}</b></span></summary>${apTable(paid.slice().sort((a,b)=>String(b['支払日']||'').localeCompare(String(a['支払日']||''))))}</details>`;
}

let REC=null, RECON=false;
function micUI(on,msg){
  const b=document.getElementById('mic'), h=document.getElementById('michead'), sub=document.getElementById('micsub');
  if(!b) return; b.classList.toggle('on',on); b.textContent = on?'■':'🎤';
  if(h) h.textContent = on?'聞いています…':'押して話す';
  if(sub&&msg) sub.textContent = msg;
}
function stopMic(){ if(REC&&RECON){ try{REC.stop();}catch(e){} } RECON=false; micUI(false); }
function toggleMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const ta = document.getElementById('vtext');
  if(!SR){ micUI(false,'このブラウザは音声入力に対応していません。下の欄でキーボードのマイクを使ってください'); ta.focus(); return; }
  if(RECON){ stopMic(); return; }
  REC = new SR(); REC.lang='ja-JP'; REC.continuous=true; REC.interimResults=true;
  let base = ta.value ? ta.value.trim()+' ' : '';
  REC.onstart=()=>{ RECON=true; micUI(true,'話し終えたら、もう一度押して止めてください'); };
  REC.onresult=e=>{ let fin='',itm='';
    for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal) fin+=r[0].transcript; else itm+=r[0].transcript; }
    if(fin) base += fin; ta.value = (base+itm).trim(); };
  REC.onerror=ev=>{ RECON=false; micUI(false, ev.error==='not-allowed' ? 'マイクの使用が許可されていません。ブラウザの設定で許可してください' : '聞き取れませんでした。もう一度お試しください'); };
  REC.onend=()=>{ if(RECON){ try{REC.start();}catch(e){ RECON=false; micUI(false); } } else micUI(false,'「この内容で下書きを作る」を押してください'); };
  try{ REC.start(); }catch(e){ micUI(false,'マイクを起動できませんでした'); }
}

function busy(b){ S.busy=b; document.querySelectorAll('.btn.pri').forEach(x=>x.disabled=b); }
// 生成中は画面全体を覆って「止まっていない」ことを見せる。経過秒が動くのが要点
let _wk=null;
function showWorking(title, sub, timer){
  hideWorking();
  const el=document.createElement('div'); el.id='working';
  el.innerHTML=`<div class="wk"><div class="spin"></div><div class="wkt">${esc(title)}</div><div class="wks">${esc(sub||'')}</div><div class="wkc" id="wkc"></div></div>`;
  document.body.appendChild(el); busy(true);
  if(timer){ const t0=Date.now(); const c=document.getElementById('wkc'); _wk=setInterval(()=>{ const s=Math.floor((Date.now()-t0)/1000); c.textContent=`${s}秒経過`+(s>45?'　もう少しかかっています':''); },500); }
}
function hideWorking(){ if(_wk){ clearInterval(_wk); _wk=null; } const el=document.getElementById('working'); if(el) el.remove(); busy(false); }
// 写真はそのまま送ると数MBになる。長辺1600pxに縮めてから送る
function shrinkImage(file, max){
  max=max||1600;
  return new Promise((ok,ng)=>{
    const fr=new FileReader();
    fr.onerror=()=>ng(new Error('read'));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>ng(new Error('decode'));
      img.onload=()=>{
        const k=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement('canvas');
        c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        ok(c.toDataURL('image/jpeg',0.85));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

    if(g.dataset.seg==='entityId'){ const box=document.getElementById('accseg'); if(box){ box.innerHTML=segAccount('accountId','',b.dataset.val); bindSegs(); } }
    if(g.dataset.seg==='eentity'){ const box=document.getElementById('eaccseg'); if(box){ box.innerHTML=segAccount('eaccount','',b.dataset.val); bindSegs(); } }
  }));
}

}

  const vc=document.getElementById('vclear'); if(vc) vc.onclick=()=>{ document.getElementById('vtext').value=''; };
  const vs=document.getElementById('vshot'), vf=document.getElementById('vfile'), vgi=document.getElementById('vgoimg');

}
