<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>mela 請求ハブ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{--bg:#F6F4F1;--panel:#fff;--line:#E4E0DB;--line2:#CFC9C2;--ink:#1F1B1A;--ink2:#5B5551;--mute:#8C857F;--acc:#F05A3E;--accbg:#FDEDE8;--ok:#1E8A5A;--okbg:#E3F3EA;--warn:#B26A00;--warnbg:#FBEFD6;--bad:#C8322B;--badbg:#FAE3E1;--info:#2B5DA8;--infobg:#E3ECF8;--grey:#EEEBE7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Hiragino Sans",sans-serif;font-size:14px;line-height:1.6}
button,select,input,textarea{font:inherit}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh}
.brand{font-weight:700;font-size:15px}.brand small{display:block;font-weight:400;color:var(--mute);font-size:11px}
.nav{display:flex;flex-direction:column;gap:2px}.nav button{text-align:left;background:none;border:0;color:var(--ink2);padding:8px 10px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between}
.nav button.on{background:var(--accbg);color:var(--acc);font-weight:700}.cnt{font-size:11px;background:var(--grey);border-radius:10px;padding:0 7px}
.side .foot{margin-top:auto;font-size:11px;color:var(--mute);word-break:break-all}.side .foot a{color:var(--info)}
.main{padding:24px 28px 80px;min-width:0}
h1{font-size:19px;margin:0 0 4px}.sub{color:var(--mute);margin:0 0 18px;font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:18px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}.tile .l{font-size:12px;color:var(--mute)}.tile .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}.tile .s{font-size:12px;color:var(--ink2)}
.tile.bad .v{color:var(--bad)}.tile.warn .v{color:var(--warn)}.tile.ok .v{color:var(--ok)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px}.card h2{font-size:14px;margin:0 0 8px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}
th{font-size:11.5px;color:var(--mute);font-weight:500}td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.row{cursor:pointer}tr.row:hover td{background:var(--grey)}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;font-weight:700}
.p-ok{background:var(--okbg);color:var(--ok)}.p-warn{background:var(--warnbg);color:var(--warn)}.p-bad{background:var(--badbg);color:var(--bad)}.p-info{background:var(--infobg);color:var(--info)}.p-grey{background:var(--grey);color:var(--ink2)}
.ent{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;color:#fff;background:#FF4D0A}.ent.E01{background:linear-gradient(135deg,#E8456B,#F06A2D)}
.btn{border:1px solid var(--line2);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:6px;font-size:13px;cursor:pointer}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}.btn.sm{padding:3px 9px;font-size:12px}.btn:disabled{opacity:.45;cursor:default}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.sp{flex:1}
.filters button{border:1px solid var(--line);background:var(--panel);color:var(--ink2);border-radius:14px;padding:3px 11px;font-size:12px;cursor:pointer;margin-right:4px}.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sel{padding:6px 8px;border:1px solid var(--line2);border-radius:6px;background:var(--panel);color:var(--ink);width:100%}
.fl{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute);margin-bottom:10px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:1000px){.split{grid-template-columns:1fr}}
.note{font-size:12px;color:var(--ink2);background:var(--grey);border-radius:6px;padding:8px 12px;margin-bottom:12px}
.empty{color:var(--mute);padding:16px 0;text-align:center}
.paperwrap{background:var(--grey);padding:14px;border-radius:8px;overflow:auto}
iframe.paper{width:210mm;height:297mm;border:0;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.12);display:block;margin:0 auto;transform-origin:top left}
textarea.mail{width:100%;min-height:260px;border:1px solid var(--line2);border-radius:6px;padding:10px;line-height:1.7;resize:vertical}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;max-width:80vw}
#toast.on{opacity:1}
@media(max-width:820px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;gap:8px;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line)}.nav{flex-direction:row;flex-wrap:wrap}.main{padding:16px 12px 60px}.side .foot{display:none}}
</style></head><body>
<div class="app">
  <aside class="side"><div class="brand">mela 請求ハブ<small>invoice@melagrp.com</small></div><nav class="nav" id="nav"></nav>
    <div class="foot" id="foot"></div></aside>
  <main class="main" id="main"><div class="empty">読み込み中…</div></main>
</div>
<div id="toast"></div>
<script>
const USER = '';
const VIEWS = [['home','今月'],['new','請求を作る'],['ar','請求の一覧'],['invoice','請求書を見る'],['dun','催促'],['ap','支払う側'],['line','LINE受信'],['settings','設定']];
const PILL = {'作成待ち':'p-grey','確認待ち':'p-warn','作成済':'p-info','送付済':'p-info','入金済':'p-ok','未入金':'p-warn','催促中':'p-bad','取消':'p-grey','支払予定':'p-info','支払済':'p-ok'};
const S = { view:'home', boot:null, ar:[], ap:[], line:[], dash:null, sel:null, filter:'all', busy:false };
const yen = n => n==null||n===''||isNaN(n) ? '—' : '¥'+Math.round(Number(n)).toLocaleString('ja-JP');
const pill = s => `<span class="pill ${PILL[s]||'p-grey'}">${s||'—'}</span>`;
const entTag = e => `<span class="ent ${e}">${e==='E01'?'mela':e==='E02'?'mela gym':e}</span>`;
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let CODE = ''; try { CODE = localStorage.getItem('melahub-code') || ''; } catch(e) {}
function askCode(msg){
  document.getElementById('main').innerHTML = `<div class="card" style="max-width:420px;margin:40px auto"><h2>mela 請求ハブ</h2><p class="sub">${msg || '合言葉を入力してください。台帳の「設定」シートにあります。'}</p>
    <form id="codeform" onsubmit="return false"><input id="codein" class="sel" type="password" autocomplete="current-password" placeholder="合言葉" autofocus><div class="tools" style="margin-top:10px"><button class="btn pri" id="codego">開く</button></div></form></div>`;
  document.getElementById('codego').onclick = () => { CODE = document.getElementById('codein').value.trim(); if(!CODE) return; try { localStorage.setItem('melahub-code', CODE); } catch(e) {} load(); };
  document.getElementById('codeform').onsubmit = () => { document.getElementById('codego').click(); return false; };
  return false;
}
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwXOKcewGxJTEUf2IfNTWgElPXqFvfZVHpkKEwWFNn3nUMzqwkuDBtO7sHXsmqeaQIK/exec';
async function call(fn, ...args) {
  const r = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ api: fn, code: CODE, args }), redirect: 'follow' });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'error');
  return j.result;
}
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),3500); }
function daysLate(r){ if(!r['支払期日']) return 0; return Math.floor((new Date(S.boot.today)-new Date(r['支払期日']))/86400000); }
const isUnpaid = r => ['送付済','未入金','催促中'].includes(r['状態']);

async function load(){
  if(!CODE) { askCode(); return; }
  document.getElementById('main').innerHTML = '<div class="empty">読み込み中…</div>';
  try{
    try { S.boot = await call('api_bootstrap'); }
    catch(e){ if(String(e.message||e).includes('BAD_CODE')){ CODE=''; try{localStorage.removeItem('melahub-code');}catch(_){} askCode('合言葉が違います。もう一度入力してください。'); return; } throw e; }
    document.getElementById('foot').innerHTML = `${esc(USER||'合言葉でログイン中')}<br><a href="${S.boot.ledgerUrl}" target="_blank">台帳を開く</a> ／ <a href="${S.boot.hubUrl}" target="_blank">Driveを開く</a>`;
    await refresh();
  }catch(e){ document.getElementById('main').innerHTML = `<div class="note">読み込みに失敗しました: ${esc(e.message||e)}</div>`; }
}
async function refresh(){
  const [ar, ap, dash, line] = await Promise.all([call('api_receivables'), call('api_payables'), call('api_dashboard'), call('api_lineInbox')]);
  S.ar = ar; S.ap = ap; S.dash = dash; S.line = line; render();
}
function counts(){ return { ar:S.ar.length, dun:S.ar.filter(r=>isUnpaid(r)&&daysLate(r)>0).length, ap:S.ap.filter(r=>['確認待ち','支払予定'].includes(r['状態'])).length, line:S.line.filter(r=>r['状態']==='未処理').length }; }
function renderNav(){ const c=counts(); document.getElementById('nav').innerHTML = VIEWS.map(([k,l])=>`<button class="${S.view===k?'on':''}" data-v="${k}">${l}${c[k]?`<span class="cnt">${c[k]}</span>`:''}</button>`).join('');
  document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;render();}); }

function vHome(){
  const d=S.dash; if(!d) return '';
  const todo = [];
  S.ar.forEach(r=>{ if(isUnpaid(r)&&daysLate(r)>0) todo.push([r,'p-bad',`期日から${daysLate(r)}日超過`,'dun']); else if(r['状態']==='確認待ち') todo.push([r,'p-warn',r['メモ']||'内容確認が必要','invoice']); else if(r['状態']==='作成済') todo.push([r,'p-info',r['下書きURL']?'Gmail下書きあり。送ったら「送付済」に':'PDF作成済み。送付後に「送付済」に','invoice']); });
  S.ap.forEach(r=>{ if(['確認待ち','支払予定'].includes(r['状態'])&&r['支払期日']&&r['支払期日']<d.today) todo.push([r,'p-bad','支払期日を過ぎています','ap']); });
  return `<h1>今月</h1><p class="sub">${d.today} 時点。台帳の実データです。</p>
  <div class="tiles">
   <div class="tile bad"><div class="l">入金の期日超過</div><div class="v">${yen(d.overdue.sum)}</div><div class="s">${d.overdue.n}件</div></div>
   <div class="tile warn"><div class="l">入金待ち（期日内）</div><div class="v">${yen(d.unpaid.sum)}</div><div class="s">${d.unpaid.n}件</div></div>
   <div class="tile ok"><div class="l">今月の入金</div><div class="v">${yen(d.paidM.sum)}</div><div class="s">${d.paidM.n}件</div></div>
   <div class="tile"><div class="l">作成中の請求</div><div class="v">${yen(d.toMake.sum)}</div><div class="s">${d.toMake.n}件</div></div>
   <div class="tile ${d.payOverdue.n?'bad':''}"><div class="l">こちらが払う予定</div><div class="v">${yen(d.payDue.sum)}</div><div class="s">${d.payDue.n}件${d.payOverdue.n?`　うち期日超過 ${d.payOverdue.n}件`:''}</div></div>
   <div class="tile"><div class="l">今月受け取った請求書</div><div class="v">${d.receivedM}</div><div class="s">件（Driveに保存済み）</div></div>
  </div>
  <div class="card"><h2>要対応</h2>${todo.length?`<div class="tw"><table>${todo.map(([r,c,t,v])=>`<tr class="row" data-id="${esc(r['請求ID']||r['受領ID'])}" data-v="${v}"><td>${entTag(r['法人'])}</td><td>${esc(r['取引先'])}<div style="font-size:11.5px;color:var(--mute)">${esc(r['件名'])}</div></td><td class="r">${yen(r['税込']||r['税込金額'])}</td><td>${pill(r['状態'])}<div style="font-size:11.5px;color:var(--ink2)">${esc(t)}</div></td></tr>`).join('')}</table></div>`:'<div class="empty">対応が必要なものはありません</div>'}</div>
  <div class="note">入金状況は、GMOあおぞらのAPI連携が終わるまでは手で「入金済」に変えます（第2段階で自動化）。</div>`;
}

const FILTERS=[['all','すべて'],['make','作成中'],['sent','送付済'],['unpaid','入金待ち・催促'],['paid','入金済']];
function vAr(){
  const a=S.ar.filter(r=>{const s=r['状態'];return S.filter==='all'||(S.filter==='make'&&['作成待ち','確認待ち','作成済'].includes(s))||(S.filter==='sent'&&s==='送付済')||(S.filter==='unpaid'&&isUnpaid(r)&&s!=='送付済')||(S.filter==='paid'&&s==='入金済');});
  return `<h1>請求の一覧</h1><p class="sub">1請求書1行。行をクリックで請求書へ。過去にinvoyで発行した分は金額が空です（PDFはDriveに保存済み）。</p>
  <div class="tools"><div class="filters">${FILTERS.map(([k,l])=>`<button class="${S.filter===k?'on':''}" data-f="${k}">${l}</button>`).join('')}</div><span class="sp"></span><span style="font-size:12px;color:var(--mute)">${a.length}件</span></div>
  <div class="card" style="padding:0"><div class="tw"><table><tr><th>請求ID</th><th>法人</th><th>宛名</th><th>件名</th><th class="r">税込</th><th>請求日</th><th>期日</th><th>担当</th><th>送付</th><th>状態</th><th>PDF</th></tr>
  ${a.map(r=>`<tr class="row" data-id="${esc(r['請求ID'])}" data-v="invoice"><td style="font-family:monospace;font-size:12px">${esc(r['請求ID'])}</td><td>${entTag(r['法人'])}</td><td>${esc(r['取引先'])}</td><td style="max-width:240px;overflow:hidden;text-overflow:ellipsis">${esc(r['件名'])}</td><td class="r">${yen(r['税込'])}</td><td>${esc(r['請求日'])}</td><td style="${isUnpaid(r)&&daysLate(r)>0?'color:var(--bad);font-weight:700':''}">${esc(r['支払期日'])}</td><td>${esc(r['担当'])}</td><td>${esc(r['送付経路'])}</td>
   <td><select class="sel stsel" data-sheet="売掛台帳" data-col="請求ID" data-id="${esc(r['請求ID'])}" style="width:auto;padding:2px 6px;font-size:12px">${S.boot.statuses.map(s=>`<option ${r['状態']===s?'selected':''}>${s}</option>`).join('')}</select></td>
   <td>${r['PDF']?`<a href="${esc(String(r['PDF']).split('\n')[0])}" target="_blank">開く</a>`:''}</td></tr>`).join('')||'<tr><td colspan="11" class="empty">まだありません</td></tr>'}</table></div></div>`;
}

function vAp(){
  const a=S.ap;
  return `<h1>支払う側</h1><p class="sub">受け取った請求書と、こちらが出した支払通知書。振り込んだら「支払済」に。GMO連携後は自動で消えます。</p>
  <div class="card" style="padding:0"><div class="tw"><table><tr><th>受領ID</th><th>法人</th><th>取引先</th><th>件名</th><th>受領日</th><th>支払期日</th><th class="r">税込</th><th>発生源</th><th>状態</th><th>PDF</th></tr>
  ${a.map(r=>`<tr><td style="font-family:monospace;font-size:12px">${esc(r['受領ID'])}</td><td>${entTag(r['法人'])}</td><td>${esc(r['取引先'])}</td><td style="max-width:260px;overflow:hidden;text-overflow:ellipsis">${esc(r['件名'])}</td><td>${esc(r['受領日'])}</td><td style="${['確認待ち','支払予定'].includes(r['状態'])&&r['支払期日']&&r['支払期日']<S.boot.today?'color:var(--bad);font-weight:700':''}">${esc(r['支払期日'])}</td><td class="r">${yen(r['税込金額'])}</td><td>${esc(r['発生源'])}</td>
   <td><select class="sel stsel" data-sheet="買掛台帳" data-col="受領ID" data-id="${esc(r['受領ID'])}" style="width:auto;padding:2px 6px;font-size:12px">${['確認待ち','支払予定','支払済','対象外'].map(s=>`<option ${r['状態']===s?'selected':''}>${s}</option>`).join('')}</select></td>
   <td>${r['PDF']?`<a href="${esc(String(r['PDF']).split('\n')[0])}" target="_blank">開く</a>`:'<span style="color:var(--mute)">リンク型</span>'}</td></tr>`).join('')||'<tr><td colspan="10" class="empty">まだありません</td></tr>'}</table></div></div>`;
}

function vLine(){
  return `<h1>LINE受信</h1><p class="sub">「mela 請求受付」に届いたもの。第3段階で、ここから請求や立替の行を自動で起こします。</p>
  <div class="card" style="padding:0"><div class="tw"><table><tr><th>受信日時</th><th>送信者</th><th>種別</th><th>本文</th><th>ファイル</th><th>状態</th></tr>
  ${S.line.map(r=>`<tr><td>${esc(r['受信日時'])}</td><td>${esc(r['表示名'])}</td><td>${esc(r['種別'])}</td><td style="white-space:normal;max-width:420px">${esc(r['本文'])}</td><td>${r['Driveリンク']?`<a href="${esc(r['Driveリンク'])}" target="_blank">${esc(r['ファイル'])}</a>`:''}</td><td>${pill(r['状態'])}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">まだありません。LINEで @725ysdjf を友だち追加して送ると、ここに入ります</td></tr>'}</table></div></div>`;
}

function itemRow(n){ return `<div class="split irow" style="gap:8px;margin-bottom:6px;grid-template-columns:2fr 1fr"><input name="item${n}" class="sel" placeholder="品目 ${n}"><input name="amt${n}" class="sel" type="number" min="0" step="1" placeholder="単価（税抜）"></div>`; }
function vNew(){
  const b=S.boot; const clients=[...new Set(S.ar.map(r=>r['取引先']).concat(b.clients.map(c=>c['正式社名'])))].filter(Boolean);
  const nextMonthEnd = (()=>{const d=new Date(b.today);const e=new Date(d.getFullYear(),d.getMonth()+2,0);return e.toISOString().slice(0,10);})();
  const thisMonthEnd = (()=>{const d=new Date(b.today);const e=new Date(d.getFullYear(),d.getMonth()+1,0);return e.toISOString().slice(0,10);})();
  return `<h1>請求を作る</h1><p class="sub">1回きりの請求はここから。確認待ちに入り、そのまま請求書のPDFとGmail下書きまで作れます。</p>
  <div class="card"><form id="newform" onsubmit="return false"><div class="split"><div>
    <label class="fl">請求元の法人<select name="entityId" class="sel">${b.entities.map(e=>`<option value="${e['法人ID']}">${esc(e['正式名'])}</option>`).join('')}</select></label>
    <label class="fl">宛名<input name="to" class="sel" list="clients" placeholder="社名を入れると候補が出ます" autocomplete="off" required></label><datalist id="clients">${clients.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
    <label class="fl">件名<input name="subject" class="sel" placeholder="コーポレートブランディング業務" required></label>
    <label class="fl">送付先メール<input name="mail" class="sel" placeholder="keiri@example.co.jp（LINEなら空欄）"></label>
    <div class="split"><label class="fl">送付方法<select name="via" class="sel"><option>メール</option><option>LINE</option></select></label><label class="fl">担当<select name="staff" class="sel">${b.staff.map(s=>`<option>${s}</option>`).join('')}</select></label></div>
   </div><div>
    <div class="fl" style="display:block">品目（税抜）</div><div id="itemrows">${itemRow(1)}${itemRow(2)}</div><button type="button" class="btn sm" id="additem" style="margin-bottom:10px">＋ 品目を追加</button>
    <div class="split"><label class="fl">請求日<input name="date" class="sel" type="date" value="${thisMonthEnd}"></label><label class="fl">支払期日<input name="due" class="sel" type="date" value="${nextMonthEnd}"></label></div>
    <label class="fl">振込先口座<select name="accountId" class="sel">${b.accounts.map(a=>`<option value="${a['口座ID']}">${esc(a['名義'])}　${esc(a['支店'])}　${esc(a['口座番号'])}</option>`).join('')}</select></label>
    <label class="fl" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" name="feeOurs" style="width:auto"> 振込手数料は弊社負担</label>
   </div></div>
   <div class="tools" style="margin-top:12px"><button class="btn pri" id="newsubmit">確認待ちに追加して請求書を見る</button><span style="font-size:12px;color:var(--mute)">税は10%外税で自動計算</span></div></form></div>`;
}
async function submitNew(){
  const f=document.getElementById('newform'); const g=n=>(f.elements[n]||{}).value||'';
  const cnt=f.querySelectorAll('.irow').length; const items=[]; for(let n=1;n<=cnt;n++){ if(g('item'+n)) items.push({name:g('item'+n),qty:1,unit:g('amt'+n)===''?null:Number(g('amt'+n))}); }
  if(!g('to')||!g('subject')||!items.length){ toast('宛名・件名・品目を入れてください'); return; }
  busy(true);
  try{ const id=await call('api_createInvoice',{entityId:g('entityId'),to:g('to'),subject:g('subject'),mail:g('mail'),via:g('via'),staff:g('staff'),items,date:g('date'),due:g('due'),accountId:g('accountId'),feeOurs:!!(f.elements.feeOurs&&f.elements.feeOurs.checked)});
    toast('追加しました: '+id); S.sel=id; S.view='invoice'; await refresh(); }
  catch(e){ toast('失敗: '+(e.message||e)); } finally{ busy(false); }
}

function vInvoice(){
  const inv=S.ar.find(r=>r['請求ID']===S.sel)||S.ar.find(r=>['確認待ち','作成済'].includes(r['状態']))||S.ar[0];
  if(!inv) return '<h1>請求書を見る</h1><div class="empty">請求がありません</div>';
  S.sel=inv['請求ID']; const s=inv['状態']; const canPdf=inv.items&&inv.items.length&&!inv.items.some(i=>i.unit==null);
  return `<h1>請求書を見る</h1><p class="sub">「PDFを作る」でDriveに保存し、メール送付ならinvoice@のGmailに下書きができます。送信は人が押します。</p>
  <div class="tools"><select id="invsel" class="sel" style="width:auto;max-width:460px">${S.ar.map(r=>`<option value="${esc(r['請求ID'])}" ${r['請求ID']===inv['請求ID']?'selected':''}>${esc(r['請求ID'])}　${esc(r['取引先'])}　${yen(r['税込'])}</option>`).join('')}</select>${pill(s)}<span class="sp"></span>
   ${canPdf?`<button class="btn pri" id="mkpdf">${s==='作成済'?'PDFと下書きを作り直す':'PDFを作って下書きへ'}</button>`:''}
   ${inv['PDF']?`<a class="btn" href="${esc(String(inv['PDF']).split('\n')[0])}" target="_blank">PDFを開く</a>`:''}
   ${inv['下書きURL']?`<a class="btn" href="${esc(inv['下書きURL'])}" target="_blank">Gmail下書きを開く</a>`:''}
   ${s==='作成済'?`<button class="btn" id="marksent">送った → 送付済にする</button>`:''}
   ${isUnpaid(inv)?`<button class="btn" id="markpaid">入金を確認した → 入金済</button>`:''}</div>
  ${!inv.items||!inv.items.length?`<div class="note">この請求は過去にinvoyで発行した分の取り込みなので、品目データがありません。PDFはDriveの保存分を開いてください。</div>`:''}
  ${inv.items&&inv.items.some(i=>i.unit==null)?`<div class="note">金額が未確定の品目があります。台帳の品目JSONを直すか、作り直してください。</div>`:''}
  ${inv['送付経路']==='LINE'?`<div class="note">送付方法がLINEです。PDFを作ったら「PDFを開く」からダウンロードして送り、送付済にしてください。</div>`:''}
  <div class="paperwrap"><iframe class="paper" id="paperframe" sandbox="allow-same-origin"></iframe></div>`;
}
async function loadPaper(){
  const f=document.getElementById('paperframe'); if(!f||!S.sel) return;
  try{ const html=await call('api_invoiceHtml',S.sel); f.srcdoc=html; fitPaper(); }catch(e){ f.srcdoc=`<p style="font-family:sans-serif;padding:20px">${esc(e.message||e)}</p>`; }
}
function fitPaper(){ const w=document.querySelector('.paperwrap'),p=document.getElementById('paperframe'); if(!w||!p) return; const avail=w.clientWidth-28, pw=794; const k=Math.min(1,avail/pw); p.style.transform=`scale(${k})`; w.style.height=(1123*k+28)+'px'; }
window.addEventListener('resize',fitPaper);

function vDun(){
  const a=S.ar.filter(r=>isUnpaid(r)&&daysLate(r)>0).sort((x,y)=>daysLate(y)-daysLate(x));
  const inv=a.find(r=>r['請求ID']===S.sel)||a[0]; if(inv) S.sel=inv['請求ID'];
  return `<h1>催促</h1><p class="sub">期日を過ぎて入金待ちのものだけ。ボタンでinvoice@のGmailに催促の下書きができます。</p>
  ${!a.length?'<div class="empty">期日超過の入金待ちはありません</div>':`<div class="split"><div class="card" style="padding:0"><div class="tw"><table><tr><th>宛名</th><th class="r">金額</th><th>期日</th><th class="r">超過</th><th>状態</th></tr>
   ${a.map(r=>`<tr class="row" data-id="${esc(r['請求ID'])}" data-v="dun"><td>${entTag(r['法人'])} ${esc(r['取引先'])}<div style="font-family:monospace;font-size:11px;color:var(--mute)">${esc(r['請求ID'])}</div></td><td class="r">${yen(r['税込'])}</td><td>${esc(r['支払期日'])}</td><td class="r" style="color:var(--bad);font-weight:700">${daysLate(r)}日</td><td>${pill(r['状態'])}</td></tr>`).join('')}</table></div></div>
   <div class="card"><h2>${esc(inv['取引先'])}　${yen(inv['税込'])}</h2><div style="font-size:12px;color:var(--mute)">To: ${esc(inv['送付先メール']||'（メール未登録。文面をコピーして送ってください）')}　Cc: invoice@melagrp.com</div>
    <div class="tools" style="margin:10px 0"><button class="btn pri" id="mkdun">${inv['状態']==='催促中'?'2回目の催促下書きを作る':'催促の下書きを作る'}</button><button class="btn" id="markpaid2">入金を確認した → 入金済</button></div>
    <textarea class="mail" id="dunbody" placeholder="「催促の下書きを作る」を押すと文面がここに出ます"></textarea></div></div>`}`;
}

function vSettings(){
  const b=S.boot;
  return `<h1>設定</h1><p class="sub">マスタは台帳スプレッドシートで直接編集できます。ここは確認用です。</p>
  ${b.entities.map(e=>`<div class="card"><h2>${entTag(e['法人ID'])}　${esc(e['正式名'])}　<span style="font-weight:400;color:var(--mute);font-size:12px">登録番号 ${esc(e['登録番号'])}　決算${esc(e['決算月'])}月</span></h2>
   <div class="tw"><table><tr><th>口座</th><th>銀行</th><th>支店</th><th class="r">番号</th><th>名義</th><th>用途</th></tr>${b.accounts.filter(a=>a['法人ID']===e['法人ID']).map(a=>`<tr><td>${esc(a['口座ID'])}</td><td>${esc(a['銀行'])}</td><td>${esc(a['支店'])}</td><td class="r">${esc(a['口座番号'])}</td><td>${esc(a['名義'])}</td><td>${esc(a['用途'])}</td></tr>`).join('')}</table></div></div>`).join('')}
  <div class="card"><h2>取引先マスタ（${b.clients.length}件）</h2><div class="tw"><table><tr><th>ID</th><th>正式社名</th><th>宛名</th><th>メール</th><th>送付</th><th>担当</th></tr>${b.clients.map(c=>`<tr><td>${esc(c['取引先ID'])}</td><td>${esc(c['正式社名'])}</td><td>${esc(c['宛名'])}</td><td>${esc(c['メール'])}</td><td>${esc(c['送付方法'])}</td><td>${esc(c['担当'])}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">請求を作ると自動で増えます</td></tr>'}</table></div></div>
  <div class="card"><h2>LINE</h2><div>友だち追加ID: <b>@725ysdjf</b>（mela 請求受付）。担当者はこのIDで追加して、請求内容や領収書の写真を送るだけです。</div></div>`;
}

function busy(b){ S.busy=b; document.querySelectorAll('.btn.pri').forEach(x=>x.disabled=b); }
function render(){
  renderNav();
  const m=document.getElementById('main');
  m.innerHTML = ({home:vHome,new:vNew,ar:vAr,invoice:vInvoice,dun:vDun,ap:vAp,line:vLine,settings:vSettings})[S.view]();
  m.querySelectorAll('tr.row').forEach(tr=>tr.onclick=ev=>{ if(ev.target.closest('select,a,button')) return; S.sel=tr.dataset.id; S.view=tr.dataset.v||'invoice'; render(); });
  m.querySelectorAll('.stsel').forEach(s=>s.onchange=async()=>{ try{ await call('api_setStatus',s.dataset.sheet,s.dataset.col,s.dataset.id,s.value); toast('更新しました'); await refresh(); }catch(e){ toast('失敗: '+(e.message||e)); } });
  m.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;render();});
  const is=document.getElementById('invsel'); if(is) is.onchange=()=>{S.sel=is.value;render();};
  const ai=document.getElementById('additem'); if(ai) ai.onclick=()=>{const box=document.getElementById('itemrows');box.insertAdjacentHTML('beforeend',itemRow(box.querySelectorAll('.irow').length+1));};
  const ns=document.getElementById('newsubmit'); if(ns) ns.onclick=submitNew;
  const mk=document.getElementById('mkpdf'); if(mk) mk.onclick=async()=>{ busy(true); toast('PDFを作っています…'); try{ const r=await call('api_makePdfAndDraft',S.sel); toast(r.draft?'PDFとGmail下書きを作りました':'PDFを作りました'); await refresh(); }catch(e){ toast('失敗: '+(e.message||e)); } finally{ busy(false);} };
  const ms=document.getElementById('marksent'); if(ms) ms.onclick=async()=>{ await call('api_setStatus','売掛台帳','請求ID',S.sel,'送付済'); toast('送付済にしました'); await refresh(); };
  ['markpaid','markpaid2'].forEach(id=>{ const b=document.getElementById(id); if(b) b.onclick=async()=>{ await call('api_setStatus','売掛台帳','請求ID',S.sel,'入金済'); toast('入金済にしました'); await refresh(); }; });
  const md=document.getElementById('mkdun'); if(md) md.onclick=async()=>{ busy(true); try{ const r=await call('api_dunningDraft',S.sel); document.getElementById('dunbody').value=r.text; toast(r.draft?'Gmailに催促の下書きを作りました':'メール未登録のため文面だけ作りました'); if(r.draft) window.open(r.draft,'_blank'); await refresh(); document.getElementById('dunbody').value=r.text; }catch(e){ toast('失敗: '+(e.message||e)); } finally{ busy(false);} };
  if(S.view==='invoice') loadPaper();
}
load();
</script></body></html>
